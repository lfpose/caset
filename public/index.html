<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="A cassette player for a handful of recordings worth keeping.">
  <title>caset</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <header class="brand">
    <a href="/" aria-label="caset home">caset</a>
    <span class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
  </header>

  <aside class="side" aria-label="Side A">
    <h2 class="side-title">Side A</h2>
    <ol class="tracks" id="tracks"></ol>
    <p class="side-empty" id="side-empty" hidden>No tape loaded.</p>
  </aside>

  <section class="deck" aria-label="Transport">
    <output id="counter" class="counter" aria-live="off" aria-label="Tape counter">0000</output>
    <div class="keys" role="group" aria-label="Transport keys">
      <button class="key" data-action="rewind" type="button" aria-label="Rewind"><span aria-hidden="true">◀◀</span></button>
      <button class="key key-play" data-action="play" type="button" aria-pressed="false" aria-label="Play"><span aria-hidden="true">▶</span></button>
      <button class="key" data-action="stop" type="button" aria-label="Stop"><span aria-hidden="true">■</span></button>
      <button class="key" data-action="forward" type="button" aria-label="Fast forward"><span aria-hidden="true">▶▶</span></button>
    </div>
    <p class="now" id="now">&nbsp;</p>
  </section>

  <footer class="colophon">
    <a href="https://lucaspose.cl" rel="me">lucaspose.cl</a>
  </footer>

  <audio id="player" preload="metadata"></audio>
  <script type="module" src="/app.js"></script>
</body>
</html>
