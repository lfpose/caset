<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>caset</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #e8c547;
      --shell: #1f2a44;
      --shell-hi: #2c3a5c;
      --paper: #f3eee0;
      --stripe-a: #d1462f;
      --stripe-b: #2f7f86;
      --tape: #3a2a22;
      --window: #121826;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-rows: 1fr auto;
      place-items: center;
      background: var(--bg);
      color: var(--shell);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { display: grid; place-items: center; width: 100%; }
    svg.cassette { width: min(84vw, 520px); height: auto; display: block; }
    footer { padding: 1.25rem; font-size: 0.9rem; }
    footer a {
      color: var(--shell);
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding: 0.1em 0.05em;
    }
    footer a:hover { border-bottom-width: 2px; }
    footer a:focus-visible {
      outline: 3px solid var(--stripe-a);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .label-text {
      font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
      font-size: 22px;
      fill: var(--shell);
    }

    /* Hubs rotate around their own center: each is nested in a translated <g>. */
    .hub { transform-origin: 0 0; animation: spin 4s linear infinite; }
    .hub-right { animation-duration: 2.4s; }

    /* Tape transfer: left spool shrinks while right one grows, then back. */
    .spool { transform-origin: 0 0; animation: 90s ease-in-out infinite alternate; }
    .spool-left { animation-name: shrink; }
    .spool-right { animation-name: grow; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shrink { from { transform: scale(1); } to { transform: scale(0.6); } }
    @keyframes grow { from { transform: scale(0.6); } to { transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) {
      .hub, .spool { animation: none; }
      .spool-left { transform: scale(0.85); }
      .spool-right { transform: scale(0.75); }
    }
  </style>
</head>
<body>
  <main>
    <svg class="cassette" viewBox="0 0 400 250" role="img" aria-label="A playing cassette tape">
      <!-- shell -->
      <rect x="4" y="4" width="392" height="242" rx="14" fill="var(--shell)"/>
      <rect x="12" y="12" width="376" height="226" rx="10" fill="var(--shell-hi)"/>

      <!-- screws -->
      <g fill="var(--shell)" stroke="var(--paper)" stroke-width="1" stroke-opacity="0.35">
        <circle cx="22" cy="22" r="5"/>
        <circle cx="378" cy="22" r="5"/>
        <circle cx="22" cy="228" r="5"/>
        <circle cx="378" cy="228" r="5"/>
        <circle cx="200" cy="228" r="5"/>
      </g>

      <!-- bottom trapezoid with holes -->
      <path d="M92 246 L112 196 L288 196 L308 246 Z" fill="var(--shell)"/>
      <g fill="var(--window)">
        <rect x="128" y="214" width="12" height="18" rx="2"/>
        <rect x="160" y="214" width="12" height="18" rx="2"/>
        <rect x="228" y="214" width="12" height="18" rx="2"/>
        <rect x="260" y="214" width="12" height="18" rx="2"/>
      </g>

      <!-- paper label -->
      <rect x="40" y="32" width="320" height="150" rx="8" fill="var(--paper)"/>
      <rect x="40" y="32" width="320" height="16" fill="var(--stripe-a)"/>
      <rect x="40" y="48" width="320" height="10" fill="var(--stripe-b)"/>
      <text class="label-text" x="60" y="82">caset — side A</text>

      <!-- window -->
      <rect x="96" y="96" width="208" height="70" rx="35" fill="var(--window)"/>

      <!-- tape spools (behind hubs) -->
      <g transform="translate(150 131)">
        <circle class="spool spool-left" r="30" fill="var(--tape)"/>
      </g>
      <g transform="translate(250 131)">
        <circle class="spool spool-right" r="30" fill="var(--tape)"/>
      </g>

      <!-- hubs: each nested in a translated group so rotation is about its own center -->
      <g transform="translate(150 131)">
        <g class="hub">
          <circle r="16" fill="var(--paper)"/>
          <circle r="9" fill="var(--window)"/>
          <g fill="var(--window)">
            <rect x="-2" y="-16" width="4" height="7" rx="1"/>
            <rect x="-2" y="-16" width="4" height="7" rx="1" transform="rotate(60)"/>
            <rect x="-2" y="-16" width="4" height="7" rx="1" transform="rotate(120)"/>
            <rect x="-2" y="-16" width="4" height="7" rx="1" transform="rotate(180)"/>
            <rect x="-2" y="-16" width="4" height="7" rx="1" transform="rotate(240)"/>
            <rect x="-2" y="-16" width="4" height="7" rx="1" transform="rotate(300)"/>
          </g>
        </g>
      </g>
      <g transform="translate(250 131)">
        <g class="hub hub-right">
          <circle r="16" fill="var(--paper)"/>
          <circle r="9" fill="var(--window)"/>
          <g fill="var(--window)">
            <rect x="-2" y="-16" width="4" height="7" rx="1"/>
            <rect x="-2" y="-16" width="4" height="7" rx="1" transform="rotate(60)"/>
            <rect x="-2" y="-16" width="4" height="7" rx="1" transform="rotate(120)"/>
            <rect x="-2" y="-16" width="4" height="7" rx="1" transform="rotate(180)"/>
            <rect x="-2" y="-16" width="4" height="7" rx="1" transform="rotate(240)"/>
            <rect x="-2" y="-16" width="4" height="7" rx="1" transform="rotate(300)"/>
          </g>
        </g>
      </g>
    </svg>
  </main>
  <footer>
    <a href="https://lucaspose.cl" rel="me">lucaspose.cl</a>
  </footer>
</body>
</html>
