<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="A small cassette player that lives on the web.">
  <title>caset</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <header class="brand">
    <a href="/" aria-label="caset home">caset</a>
  </header>

  <section class="deck" aria-label="Cassette player">
    <output id="counter" class="counter" aria-live="off" aria-label="Tape counter">0000</output>

    <div class="keys" role="group" aria-label="Transport">
      <button class="key key-rew" data-action="rewind" type="button">
        <span class="glyph" aria-hidden="true">◀◀</span><span class="name">Rewind</span>
      </button>
      <button class="key key-play" data-action="play" type="button" aria-pressed="false">
        <span class="glyph" aria-hidden="true">▶</span><span class="name">Play</span>
      </button>
      <button class="key key-stop" data-action="stop" type="button">
        <span class="glyph" aria-hidden="true">■</span><span class="name">Stop</span>
      </button>
      <button class="key key-ff" data-action="forward" type="button">
        <span class="glyph" aria-hidden="true">▶▶</span><span class="name">Forward</span>
      </button>
    </div>
    <p class="hint" id="hint">Space plays. Arrows wind.</p>
  </section>

  <footer class="colophon">
    <a href="https://lucaspose.cl" rel="me">lucaspose.cl</a>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
